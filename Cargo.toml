[package]
name = "archguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Repository architecture contracts with a shared module graph"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_semantic = "=0.152.0"
oxc_span = "=0.152.0"
oxc_syntax = "=0.152.0"
oxc_resolver = "=11.24.3"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.11.0"
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
